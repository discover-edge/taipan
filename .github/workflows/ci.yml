name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A CPython with a shared library, so the Python interop cases (tests/cases/m10) run for real.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The VS Code extension's packages, for its grammar, packaging and scripted tests (SPEC §16.8).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install the extension's packages
        working-directory: editors/vscode
        run: npm ci

      # NativeAOT's toolchain, for the native builds (SPEC §15.1), and the arm64 one, for building
      # for another architecture (SPEC §15.4); and Vim, for its syntax and indenting (SPEC §16.12).
      - name: Install clang and Vim
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross vim

      # Neovim 0.11 or later, for its LSP test (SPEC §16.12); Ubuntu's own is older.
      - name: Install Neovim
        run: |
          curl -fsSL -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz
          echo "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875  nvim.tar.gz" | sha256sum -c
          sudo tar xzf nvim.tar.gz -C /opt && rm nvim.tar.gz
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"

      - name: Build
        run: dotnet build

      # Fail, rather than skip, the interop cases if Python can't be found, and the editor tests if
      # Node.js, Vim or Neovim can't; pack and install the tool to run programs with it (SPEC
      # §12.2), and build native executables (SPEC §15).
      - name: Test
        run: dotnet test --no-build
        env:
          TAIPAN_REQUIRE_PYTHON: "1"
          TAIPAN_TEST_PACKAGE: "1"
          TAIPAN_TEST_NATIVE: "1"
          TAIPAN_REQUIRE_NODE: "1"
          TAIPAN_REQUIRE_VIM: "1"
          TAIPAN_REQUIRE_NEOVIM: "1"

  # The website (M46): its pages are generated from SPEC.md and the golden cases, and it must
  # build. Its code samples run in the Test step above, as golden cases.
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the website
        working-directory: website
        run: npm ci && npm run build
