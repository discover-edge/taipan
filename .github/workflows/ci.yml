name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A CPython with a shared library, so the Python interop cases (tests/cases/m10) run for real.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: dotnet build

      # Fail, rather than skip, the interop cases if Python can't be found.
      - name: Test
        run: dotnet test --no-build
        env:
          TAIPAN_REQUIRE_PYTHON: "1"
